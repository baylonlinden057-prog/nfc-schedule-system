<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC Class Schedule</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <p class="label">NFC CLASS SCHEDULE</p>
      <h1 id="title">Class Schedule</h1>
      <p id="status">Checking NFC tag...</p>

      <div class="image-wrap">
        <img id="scheduleImage"
             src="filipino-3a-schedule.png"
             alt="Filipino 3A Class Schedule">
      </div>

      <p class="tag" id="tagInfo">Tag: —</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
